name: Keep API awake

# Render's free instances spin down after 15 minutes without traffic, and the
# cold start costs the first visitor about a minute. The schedule below keeps
# the API warm during waking hours only: 06:00-18:00 UTC is 09:00-20:00 Kyiv in
# summer and 08:00-19:00 in winter, which is ~372 of the 750 free instance
# hours the workspace gets each month. Widening the window eats that budget --
# once it runs out, every free service in the workspace is suspended until the
# first of the next month.
on:
  schedule:
    # Every 5 minutes, not every 15: GitHub delays scheduled runs under load,
    # and a delay longer than the spin-down window would defeat the whole job.
    - cron: '*/5 6-17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 90 \
            https://api.cragatlas.app/health
