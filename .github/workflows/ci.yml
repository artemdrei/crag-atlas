name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    # shared/supabase/client.ts throws at import time without these, which
    # breaks collection of every spec that transitively imports shared/api.
    # No test reaches Supabase, so placeholders are enough.
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build:web

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # Applies supabase/migrations on first boot, in file order.
      - run: supabase start

      # `--output env` names them ANON_KEY / API_URL; the apps and both suites
      # read SUPABASE_-prefixed names.
      - name: Export the local stack's keys
        run: |
          eval "$(supabase status --output env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - run: pnpm --filter api test:integration

      # The browsers are ~50s of the job and only change when Playwright does,
      # so they are keyed on the resolved version in the lockfile.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./apps/e2e/node_modules/@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @crag-atlas/e2e exec playwright install --with-deps chromium webkit

      # The system libraries live outside the cached browser folder.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @crag-atlas/e2e exec playwright install-deps chromium webkit

      - run: pnpm --filter @crag-atlas/e2e test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
